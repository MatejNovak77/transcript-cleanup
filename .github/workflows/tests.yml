name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      # uv supplies the interpreter: hosted runners no longer ship Python 3.8
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --python ${{ matrix.python }} --with pytest python -m pytest -q tests
